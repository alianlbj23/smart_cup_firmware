# 敏感資料掃描：tools/secret_guard.py（敏感檔名＋gitleaks 固定版本，掃整個 git 歷史，輸出會遮住金鑰）
#   - main 和 PR：由 build.yml 呼叫（發版要等它通過）
#   - 其他分支的 push：這裡直接跑
# 本機的 commit／push 前檢查：bash tools/setup_hooks.sh
name: 敏感資料掃描

on:
  push:
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks＋敏感檔名
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 掃全部歷史：刪掉的檔案、舊 commit 裡的金鑰也要抓到
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # PR 用 base 分支的掃描程式和例外清單：PR 裡改掉規則（例如讓 scan 直接通過）不會影響這次的檢查。
      # base 還沒有 secret_guard.py（第一次加進來的 PR）才用 PR 自己的
      - name: 選掃描程式
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/guard"
          if [ -n "$BASE_REF" ] && git cat-file -e "origin/${BASE_REF}:tools/secret_guard.py" 2>/dev/null; then
            git show "origin/${BASE_REF}:tools/secret_guard.py" > "$RUNNER_TEMP/guard/secret_guard.py"
            # 例外清單也用 base 的（base 沒有就清空）
            if git cat-file -e "origin/${BASE_REF}:.secret-guard-allow" 2>/dev/null; then
              git show "origin/${BASE_REF}:.secret-guard-allow" > .secret-guard-allow
            else
              : > .secret-guard-allow
            fi
            echo "用 ${BASE_REF} 的 secret_guard.py"
          else
            cp tools/secret_guard.py "$RUNNER_TEMP/guard/secret_guard.py"
          fi
      - name: 安裝 gitleaks（固定版本、比對 SHA256）
        run: python "$RUNNER_TEMP/guard/secret_guard.py" install
      - name: 掃描
        run: python "$RUNNER_TEMP/guard/secret_guard.py" scan
